<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Official BRM Circular Interlocking Swirl Symbol -->
  <g transform="translate(0, 0)">
    <!-- Arc 1: Deep Navy Blue (#0B1D3A) - Top Left -->
    <path d="M 30,2 C 45,2 58,15 58,30 C 45,22 34,22 22,26 C 14,21 8,14 4,7 C 11,3 20,2 30,2 Z" fill="#0B1D3A" />
    
    <!-- Arc 2: Corporate Royal Blue (#1E4FA3) - Top Right to Middle -->
    <path d="M 58,30 C 58,45 45,58 30,58 C 38,45 38,34 34,22 C 39,14 46,8 53,4 C 57,11 58,20 58,30 Z" fill="#1E4FA3" />

    <!-- Arc 3: Deep Teal / Blue (#147094) - Bottom Right -->
    <path d="M 30,58 C 15,58 2,45 2,30 C 15,38 26,38 38,34 C 46,39 52,46 56,53 C 49,57 40,58 30,58 Z" fill="#147094" />

    <!-- Arc 4: Green Innovation (#19A37F) - Bottom Left to Center -->
    <path d="M 2,30 C 2,15 15,2 30,2 C 22,15 22,26 26,38 C 21,46 14,52 7,56 C 3,49 2,40 2,30 Z" fill="#19A37F" />
    
    <!-- Central Aperture -->
    <circle cx="30" cy="30" r="10" fill="#FFFFFF" />
  </g>

  <!-- Official BRM Typography (Montserrat Black / Bold Navy) -->
  <text x="74" y="44" font-family="'Montserrat', 'Inter', Arial, sans-serif" font-weight="900" font-size="41" fill="#0B1D3A" letter-spacing="-1">BRM</text>
</svg>
