<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061F40" />
      <stop offset="50%" stop-color="#0a2a54" />
      <stop offset="100%" stop-color="#04142b" />
    </linearGradient>

    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14243b" />
      <stop offset="100%" stop-color="#0b1728" />
    </linearGradient>

    <!-- Wall Glow behind Logo -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0878D1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#39A844" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#061F40" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glass Shine -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Table Wood Gradient -->
    <linearGradient id="tableWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3020" />
      <stop offset="30%" stop-color="#6e4932" />
      <stop offset="70%" stop-color="#543725" />
      <stop offset="100%" stop-color="#362115" />
    </linearGradient>

    <!-- Chart Gradients -->
    <linearGradient id="chartBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08AFC4" />
      <stop offset="100%" stop-color="#0754A6" />
    </linearGradient>

    <linearGradient id="chartGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BC51C" />
      <stop offset="100%" stop-color="#39A844" />
    </linearGradient>
  </defs>

  <!-- Base Room Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Back Wall Panel -->
  <rect x="50" y="40" width="1100" height="420" rx="12" fill="url(#wallGrad)" stroke="#1e3a5f" stroke-width="2" />
  
  <!-- Ceiling Light Track -->
  <line x1="50" y1="40" x2="1150" y2="40" stroke="#08AFC4" stroke-width="4" stroke-opacity="0.7" filter="blur(1px)" />

  <!-- Wall Illuminated Logo Glow (Left side of back wall) -->
  <circle cx="280" cy="180" r="140" fill="url(#logoGlow)" />

  <!-- 3D Wall Logo Emblem (Left Wall) -->
  <g transform="translate(190, 110)">
    <!-- Outer Arc Circles -->
    <path d="M 60,10 A 50,50 0 0 1 110,60" fill="none" stroke="#0878D1" stroke-width="9" stroke-linecap="round" />
    <path d="M 110,60 A 50,50 0 0 1 60,110" fill="none" stroke="#39A844" stroke-width="9" stroke-linecap="round" />
    <path d="M 60,110 A 50,50 0 0 1 10,60" fill="none" stroke="#9BC51C" stroke-width="9" stroke-linecap="round" />
    <path d="M 10,60 A 50,50 0 0 1 60,10" fill="none" stroke="#08AFC4" stroke-width="9" stroke-dasharray="30 18" stroke-linecap="round" />

    <circle cx="60" cy="60" r="35" fill="#061F40" />

    <!-- Monitor inside Logo -->
    <rect x="40" y="40" width="40" height="26" rx="4" fill="#FFFFFF" />
    <rect x="43" y="43" width="34" height="20" rx="2" fill="#061F40" />
    <path d="M 47,56 L 53,50 L 59,54 L 65,48" fill="none" stroke="#0878D1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Typography RBM -->
    <text x="135" y="78" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="-1">RBM</text>
    <text x="137" y="100" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="10.5" fill="#9BC51C" letter-spacing="1.8">CONECTAMOS SOLUÇÕES. POTENCIALIZAMOS RESULTADOS.</text>
  </g>

  <!-- Digital Dashboard Display Screen (Right Wall) -->
  <g transform="translate(560, 75)">
    <!-- Screen Outer Frame -->
    <rect x="0" y="0" width="540" height="320" rx="14" fill="#030d1a" stroke="#1c3a60" stroke-width="6" shadow="0 20px 50px rgba(0,0,0,0.8)" />
    
    <!-- Screen Header Bar -->
    <rect x="12" y="12" width="516" height="36" rx="6" fill="#091b33" />
    <text x="30" y="35" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="0.5">DASHBOARD INTEGRADO</text>
    <circle cx="490" cy="30" r="4" fill="#39A844" />
    <circle cx="505" cy="30" r="4" fill="#08AFC4" />

    <!-- KPI Box 1: Receita Operacional -->
    <rect x="24" y="60" width="115" height="65" rx="8" fill="#0a2242" stroke="#163866" stroke-width="1" />
    <text x="34" y="78" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Receita Operacional</text>
    <text x="34" y="98" font-family="Montserrat, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">R$ 4,42M</text>
    <text x="34" y="114" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#39A844">+13,8% vs mês anterior</text>

    <!-- KPI Box 2: Ticket Médio -->
    <rect x="150" y="60" width="115" height="65" rx="8" fill="#0a2242" stroke="#163866" stroke-width="1" />
    <text x="160" y="78" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Ticket Médio</text>
    <text x="160" y="98" font-family="Montserrat, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">R$ 128,90</text>
    <text x="160" y="114" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#39A844">+6,1% vs mês anterior</text>

    <!-- KPI Box 3: Clientes Ativos -->
    <rect x="276" y="60" width="115" height="65" rx="8" fill="#0a2242" stroke="#163866" stroke-width="1" />
    <text x="286" y="78" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Clientes Ativos</text>
    <text x="286" y="98" font-family="Montserrat, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">32 842</text>
    <text x="286" y="114" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#39A844">+9,1% vs mês anterior</text>

    <!-- KPI Box 4: Margem de Lucro -->
    <rect x="402" y="60" width="115" height="65" rx="8" fill="#0a2242" stroke="#163866" stroke-width="1" />
    <text x="412" y="78" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Margem de Lucro</text>
    <text x="412" y="98" font-family="Montserrat, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">18,6%</text>
    <text x="412" y="114" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#39A844">+4,2% vs mês anterior</text>

    <!-- Donut Chart Widget (Mix de Canais) -->
    <rect x="24" y="140" width="240" height="155" rx="8" fill="#0a2242" stroke="#163866" stroke-width="1" />
    <text x="36" y="160" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Mix de Canais</text>

    <!-- Donut Segments -->
    <circle cx="100" cy="225" r="45" fill="none" stroke="#0754A6" stroke-width="16" />
    <circle cx="100" cy="225" r="45" fill="none" stroke="#08AFC4" stroke-width="16" stroke-dasharray="180 300" stroke-dashoffset="-40" />
    <circle cx="100" cy="225" r="45" fill="none" stroke="#9BC51C" stroke-width="16" stroke-dasharray="70 300" stroke-dashoffset="-220" />
    <circle cx="100" cy="225" r="45" fill="none" stroke="#F36C0A" stroke-width="16" stroke-dasharray="40 300" stroke-dashoffset="-290" />
    <text x="100" y="229" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">100%</text>

    <!-- Donut Legend -->
    <rect x="165" y="180" width="8" height="8" rx="2" fill="#08AFC4" />
    <text x="178" y="188" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">PDV Supermercados</text>
    <rect x="165" y="200" width="8" height="8" rx="2" fill="#0754A6" />
    <text x="178" y="208" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">DIGMIDIA Telas</text>
    <rect x="165" y="220" width="8" height="8" rx="2" fill="#9BC51C" />
    <text x="178" y="228" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">M.O Publicidade</text>
    <rect x="165" y="240" width="8" height="8" rx="2" fill="#F36C0A" />
    <text x="178" y="248" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">Contabilidade</text>

    <!-- Bar Chart Widget (Desempenho por Área) -->
    <rect x="276" y="140" width="241" height="155" rx="8" fill="#0a2242" stroke="#163866" stroke-width="1" />
    <text x="288" y="160" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Desempenho por Área</text>
    
    <!-- Bar Chart Columns -->
    <g transform="translate(290, 175)">
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="210" y2="0" stroke="#1b3963" stroke-width="1" />
      <line x1="0" y1="30" x2="210" y2="30" stroke="#1b3963" stroke-width="1" />
      <line x1="0" y1="60" x2="210" y2="60" stroke="#1b3963" stroke-width="1" />
      <line x1="0" y1="90" x2="210" y2="90" stroke="#1b3963" stroke-width="1" />

      <!-- Bars -->
      <rect x="15" y="20" width="18" height="70" rx="3" fill="url(#chartGreen)" />
      <rect x="55" y="35" width="18" height="55" rx="3" fill="url(#chartBlue)" />
      <rect x="95" y="10" width="18" height="80" rx="3" fill="url(#chartGreen)" />
      <rect x="135" y="25" width="18" height="65" rx="3" fill="url(#chartBlue)" />
      <rect x="175" y="5" width="18" height="85" rx="3" fill="url(#chartGreen)" />

      <!-- X-axis Labels -->
      <text x="24" y="105" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Jan</text>
      <text x="64" y="105" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Fev</text>
      <text x="104" y="105" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Mar</text>
      <text x="144" y="105" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Abr</text>
      <text x="184" y="105" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Mai</text>
    </g>

    <!-- Glass Reflection -->
    <rect x="0" y="0" width="540" height="320" rx="14" fill="url(#glassShine)" pointer-events="none" />
  </g>

  <!-- Foreground Executive Conference Table -->
  <path d="M 0,480 L 1200,480 L 1200,675 L 0,675 Z" fill="url(#tableWood)" />
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#8c5b3b" stroke-width="4" />
  <line x1="0" y1="484" x2="1200" y2="484" stroke="#26170d" stroke-width="2" />

  <!-- Laptops on Table -->
  <g transform="translate(180, 450)">
    <polygon points="10,25 90,25 100,45 0,45" fill="#94a3b8" />
    <rect x="20" y="0" width="60" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="24" y="3" width="52" height="20" fill="#0878D1" opacity="0.8" />
  </g>

  <g transform="translate(720, 450)">
    <polygon points="10,25 90,25 100,45 0,45" fill="#cbd5e1" />
    <rect x="20" y="0" width="60" height="26" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <rect x="24" y="3" width="52" height="20" fill="#39A844" opacity="0.8" />
  </g>

  <!-- Executive Armchairs Silhouette Overlay -->
  <path d="M 80,480 Q 120,440 160,480 L 140,675 L 100,675 Z" fill="#050e1a" opacity="0.85" />
  <path d="M 460,480 Q 500,440 540,480 L 520,675 L 480,675 Z" fill="#050e1a" opacity="0.85" />
  <path d="M 980,480 Q 1020,440 1060,480 L 1040,675 L 1000,675 Z" fill="#050e1a" opacity="0.85" />

  <!-- Ambient Light Bloom Overlay -->
  <circle cx="830" cy="235" r="280" fill="#08AFC4" opacity="0.08" filter="blur(30px)" />
</svg>
